services:
  postgres:
    image: postgres:18
    container_name: animal_control_dev
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - ./postgres:/var/lib/postgresql
  redis:
    image: redis:8.8
    container_name: animal_control_redis 
    ports:
        - '6379:6379'
    volumes:
        - redis-data:/data
    environment:
        - REDIS_ARGS=--requirepass devpassword --appendonly yes
    restart: unless-stopped

volumes:
    redis-data:
        driver: local
